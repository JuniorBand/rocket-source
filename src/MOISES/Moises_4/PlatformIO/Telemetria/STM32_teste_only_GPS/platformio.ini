
[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino

; Gravacao pela ST-Link V2
upload_protocol = stlink
debug_tool = stlink

; Monitor serial USB
monitor_speed = 115200
monitor_port = COM14

; Biblioteca LoRa
lib_deps =
    sandeepmistry/LoRa@^0.8.0

; USB CDC
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D HAL_PCD_MODULE_ENABLED
