[platformio]
default_envs = blackpill_f411ce

[env]
platform = ststm32
framework = arduino
upload_protocol = stlink
;upload_protocol = dfu
debug_tool = stlink
monitor_speed = 115200
monitor_dtr = 1

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D ENABLE_HWSERIAL2
    -Wl,-u,_printf_float
    -I src

lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    marzogh/SPIMemory @ ^3.4.0

[env:blackpill_f401ce]
board = blackpill_f401ce

[env:blackpill_f411ce]
board = blackpill_f411ce